name: rpg_master_set
description: Caderno colaborativo e roteiro privado de campanha.
publish_to: none
version: 0.17.0-dev.28+47

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
  pdf: 3.13.1
  archive: 4.7.1
  xml: 7.1.0
  material_ui: 1.11.1
  crypto: 3.0.8
  collection: 1.19.1
  diacritic: ^0.1.6
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: 2.5.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/emblem.png
    - assets/brand/login-party.webp
    - assets/brand/login-party-portrait.webp
    - assets/brand/login-party-wide.webp
    - assets/brand/adventurers.png
    - assets/branding-fonts/CinzelDecorative-OFL.txt
    - assets/notebook/
    - assets/fonts/
  fonts:
    - family: Cinzel Decorative
      fonts:
        - asset: assets/branding-fonts/CinzelDecorative-Black.ttf
          weight: 900
    - family: Crimson Text
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-Bold.ttf
          weight: 700
    - family: RpgScript
      fonts:
        - asset: assets/fonts/RpgScript-Regular.ttf
        - asset: assets/fonts/RpgScript-Italic.ttf
          style: italic
        - asset: assets/fonts/RpgScript-Bold.ttf
          weight: 700
        - asset: assets/fonts/RpgScript-BoldItalic.ttf
          weight: 700
          style: italic
    - family: RpgMono
      fonts:
        - asset: assets/fonts/RpgMono-Regular.ttf
