name: rpg_master_set
description: Caderno colaborativo e roteiro privado de campanha.
publish_to: none
version: 0.17.0-dev.10+29

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
  material_ui: 1.11.1
  crypto: 3.0.8
  diacritic: ^0.1.6
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: 2.5.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/emblem.png
    - assets/brand/adventurers.png
  fonts:
    - family: Crimson Text
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-Bold.ttf
          weight: 700
