name: rpg_master_set
description: Caderno colaborativo e roteiro privado de campanha.
publish_to: none
version: 0.17.0-dev.2+21

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
  material_ui: 1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/emblem.png
  fonts:
    - family: Crimson Text
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-Bold.ttf
          weight: 700
